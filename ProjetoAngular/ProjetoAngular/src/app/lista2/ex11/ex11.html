<h2>Produtos</h2>

<button (click)="alternarDisponibilidade()">
  {{ somenteDisponiveis ? 'Mostrar todos' : 'Mostrar somente disponíveis' }}
</button>

<hr>

@for (produto of produtos; track produto.id) {

  @if (!somenteDisponiveis || produto.quantidade > 0) {

    <div>
      <h3>{{ produto.nome }}</h3>

      <p>Preço: {{ produto.preco | currency:'BRL' }}</p>

      <p>Quantidade: {{ produto.quantidade }}</p>

      <hr>
    </div>

  }
}
