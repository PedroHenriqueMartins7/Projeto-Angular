<h2>{{ nomeProduto }}</h2>

<p>Preço: R$ {{ preco.toFixed(2) }}</p>

<p>
  Quantidade:
  
  <button
    (click)="diminuirQuantidade()"
    [disabled]="quantidade === 1">
    -
  </button>

  {{ quantidade }}

  <button
    (click)="aumentarQuantidade()">
    +
  </button>
</p>

<p>
  Total: R$ {{ (preco * quantidade).toFixed(2) }}
</p>

<button (click)="adicionarAoCarrinho()">
  Adicionar ao carrinho
</button>

<p>{{ mensagem }}</p>
